[project]
name = "spctr"
version = "0.1.0"
description = "SR2 spctr — full agent runtime powered by SR2"
readme = "README.md"
authors = [{ name = "Diego Camizotti", email = "diego@terminuslabs.co" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "discord.py>=2.4",
    "mcp>=1.0.0,<2",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "sr2",
    "textual>=8.2.8",
]

[tool.uv.sources]
sr2 = { workspace = true }

[project.scripts]
spctr = "spctr.cli:main"

[project.entry-points."sr2.tool_providers"]
spctr_tools = "spctr.providers:SpctrToolProvider"

[project.entry-points."sr2.resolvers"]
plan = "spctr.planning.resolver:PlanResolver"
mode_guidance = "spctr.pipeline.mode_guidance_resolver:ModeGuidanceResolver"
topic_area = "spctr.pipeline.topic_area_resolver:TopicAreaResolver"

[project.entry-points."sr2.transformers"]
step_compaction = "spctr.planning.transformer:StepCompactionTransformer"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: test hits the live local relay (localhost:11434); deselected by default, run with -m live",
    'baseline_debt(bead_id): test fails for a known tracked reason; the bead id must match ^(spc|sr2)-\\d+$ (see test_baseline_debt_guard.py); deselected in CI via -m "not baseline_debt"',
]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=0.24.0", "pyte>=0.8.2", "ruff>=0.15.11"]
