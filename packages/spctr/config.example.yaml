# SR2 spctr — example configuration
#
# Copy this file, fill in your values, and pass it to spctr:
#   spctr my-config.yaml --plugin tui

# Agent-level settings
agent:
  name: my-agent

  # Restore Zulip topic/DM history from the provenance archive at Session creation.
  # agent.resume.enabled: false starts empty and suppresses restore notices.
  resume:
    enabled: true
    interrupted_marker: "[This turn was interrupted by a restart before it finished.]"
    restore_failed_notice: "Earlier context for this conversation could not be restored."

  # Recurring scheduled jobs: one switch enables BOTH the schedule tool
  # and the schedule engine. timezone (IANA) is required when enabled;
  # cron is interpreted in it. See docs/CONFIG-REFERENCE.md § Schedules.
  # schedules:
  #   enabled: true
  #   timezone: America/Phoenix
  #   poll_seconds: 30.0
  #   command_timeout_seconds: 600.0
  #   agent_timeout_seconds: 600.0
  #   zulip_topic: schedules
  #   # store_path: ~/.sr2/state/{agent}/schedules/
  #   # Every string the schedule tool shows or advertises (spc-1097);
  #   # defaults are the spec strings, shown here unchanged.
  #   texts:
  #     tool_description: Create, cancel, or manually run a recurring scheduled job (command or agent payload) that fires on a cron schedule.
  #     cron_description: "5-field cron, e.g. '0 7 * * *' or '0 9 * * 1'"
  #     agent_description: Target agent for an agent payload; omit for the creating agent
  #     channel_description: Same-platform channel name; omit for this channel
  #     topic_description: "Zulip post topic; omit for the default"
  #     label_description: Short name shown in posts and list
  #     created_format: "Schedule {id} set: {next} in {destination} ({payload_type}: {summary})"
  #     list_row_format: "{id} {next} cron={cron} {destination} {payload_type}: {summary} [{last_status}]"
  #     destination_format: "#{channel}"
  #     destination_topic_format: "#{channel} > {topic}"
  #     empty_list_message: "No schedules."
  #     never_run_label: never run
  #     cancelled_message: "Cancelled schedule {id}"
  #     executed_message: "Schedule {id} executed. Next run remains as scheduled."
  #     need_interface_error: "Error: Schedules need the Discord interface"
  #     cross_platform_error: "Error: Cross-platform schedules are not supported"
  #     resolver_unusable_error: "Error: channel lookup returned an unusable result"
  #     no_resolver_error: "Error: named channels are not available in this build"
  #     unknown_action_error: "Error: unknown action '{action}'"
  #     cron_required_error: "Error: 'cron' is required and must not be empty"
  #     invalid_cron_error: "Error: invalid cron expression: {reason}"
  #     type_required_error: "Error: 'type' is required (command or agent)"
  #     unknown_payload_type_error: "Error: unknown payload type '{type}'"
  #     command_required_error: "Error: 'command' is required for a command payload"
  #     command_too_long_error: "Error: 'command' exceeds {max} characters"
  #     instruction_required_error: "Error: 'instruction' is required for an agent payload"
  #     instruction_too_long_error: "Error: 'instruction' exceeds {max} characters"
  #     channel_not_found_error: "Error: channel '{channel}' not found on this platform"
  #     channel_ambiguous_error: "Error: channel '{channel}' is ambiguous on this platform"
  #     id_required_cancel_error: "Error: 'id' is required for cancel"
  #     id_required_run_now_error: "Error: 'id' is required for run_now"
  #     schedule_not_found_error: "Error: schedule '{id}' not found"
  #     already_cancelled_error: "Error: schedule {id} is already cancelled"
  #     cancel_failed_error: "Error: schedule {id} could not be cancelled"
  #     cancelled_schedule_error: "Error: schedule {id} is cancelled"
  #     engine_unavailable_error: "Error: schedule engine not available"

  # Built-in tools to register. Each tool is a Python class loaded by class_path.
  # Remove tools you don't want, or add custom ones.
  tools:
    - name: terminal
      class_path: spctr.tools.builtins.terminal.TerminalTool
      config:
        timeout: 30           # seconds before command is killed

    - name: file_read
      class_path: spctr.tools.builtins.file_read.FileReadTool
      config:
        max_bytes: 1000000    # refuse files larger than this

    - name: file_write
      class_path: spctr.tools.builtins.file_write.FileWriteTool

    # Uncomment to enable web search via a SearXNG instance
    # - name: web_search
    #   class_path: spctr.tools.builtins.web_search.WebSearchTool
    #   config:
    #     base_url: http://localhost:8080   # your SearXNG URL
    #     max_results: 5

    # Planning: verify-gated task completion (requires PlanResolver in pipeline)
    # - name: complete_step
    #   class_path: spctr.tools.builtins.complete_step.CompleteStepTool
    #   config:
    #     plans_root: ~/.sr2/plans   # optional; defaults to ~/.sr2/plans

    # Run another configured agent in a fresh, isolated frame.
    # - name: handoff
    #   class_path: spctr.tools.builtins.handoff.HandoffTool
    #   config:
    #     agents_root: /absolute/path/to/roles-root
    #     default_timeout: 5400
    #     description: Hand the session to another agent in a fresh frame and return its envelope when the frame ends.
    #     agent_description: Agent config name under <agents_root>/agents/
    #     prompt_description: Instructions for the target agent.
    #     timeout_description: Seconds; default from tool config.
    #     frame_id_description: Optional frame id; default handoff-<agent>-<unix seconds>.
    #     nested_error: nested handoff refused
    #     active_error: handoff already active
    #     unavailable_error: handoff requires a caller session
    #     config_error: "cannot load {path}: {error}"
    #     run_error: "{error}"

# REPL messages shown while a handoff frame is active.
repl_handoff_start: "→ {agent} took over · {frame_id}"
repl_handoff_end: "← {agent} · {status} · {duration}"
repl_handoff_stop: "⏹ Stopping {agent}…"

# LLM endpoints. "default" is required. Additional named endpoints are optional.
models:
  default:
    model: openai/YOUR_MODEL_NAME   # e.g. openai/gpt-4o, anthropic/claude-opus-4-7
    base_url: http://localhost:11434/v1  # omit for hosted APIs (OpenAI, Anthropic)

# SR2 pipeline — context compilation, token budgets, layers
pipeline:
  token_budget: 200000
  max_tool_iterations: 40   # max LLM → tool → LLM cycles per turn (SR2 enforces this)

  layers:
    # System prompt layer
    - name: system
      target: system
      resolvers:
        - type: static
          config:
            text: |
              You are a helpful AI assistant with access to tools.
              Use them when they would help answer the user's question.

    # Tool definitions layer — injects available tools into context
    - name: tools
      target: tools
      resolvers: []
      tool_providers:
        - type: spctr_tools

    # Conversation history layer
    - name: conversation
      target: messages
      resolvers:
        - type: session   # prior turns from this session
        - type: input     # current user message

# Zulip interface (--interface zulip) — see docs/CONFIG-REFERENCE.md
# zulip:
#   zuliprc: ~/.sr2/secrets/zulip/miranda.zuliprc   # bot credentials; never inline
#   mode: stream            # default; only stream or direct are accepted
#   peer_id: null           # direct requires an unquoted integer user ID; missing/null fails startup
#                           # strings, booleans and floats are rejected; ignored in stream mode
#   users: []               # integer user IDs that may trigger a turn; empty = any human
#   mention_only: false     # stream mode: a new topic starts only on @**<bot name>**
#   topic_owner_routing: false  # stream mode: one owner bot per topic (first message decides;
#                           # a later mention of another bot hands it over)
#   channels: []            # integer channel IDs; empty = every channel the queue delivers
#   channel_areas:          # string channel ID -> area; "" = no area; else the channel name
#     "2": ""
#   # working indicator (stream mode): placeholder, then the answer by edit
#   max_message_length: 10000                    # longer answers are chunked
#   thinking_message: "⏳ Thinking..."            # posted before the model call
#   empty_response_message: "(No response generated)"
#   error_message: "Error: {error}"              # {error} = the model error text
#   edit_stream_interval: 1.0                    # min seconds between text-progress edits; 0 = off
#   tool_embed_enabled: true                     # show a line per tool start/result
#   tool_line_max_chars: 80                      # {input}/{content} cut to this + "..."
#   tool_start_line: "▶ `{name}` - `{input}`"
#   tool_result_ok_line: "✓ `{name}` - `{content}`"     # newlines in {content} become |
#   tool_result_error_line: "✖ `{name}` - `{content}`"
#   handoff_start_message: "→ {agent} took over ({frame_id})"
#   handoff_end_message: "← {agent}: {status} in {duration}"
#   stop_handoff_message: "⏹ stopped {agent}"
#   stop_turn_message: "⏹ stopped"
#   stop_idle_message: "nothing running"

# Direct-mode alternative: replace the Zulip block above; --interface zulip selects it.
# Example peer 8 is a placeholder: use the intended human's user ID.
# zulip:
#   zuliprc: ~/.sr2/secrets/zulip/miranda.zuliprc
#   mode: direct
#   peer_id: 8
#   users: [8]              # nonempty must include peer_id; empty still admits only that peer
# Direct mode rejects stream posts and bot senders; no topics or area routing.
# It ignores mention_only, topic_owner_routing, channels, channel_areas and the working-indicator fields.

# Discord interface (--interface discord) — see docs/CONFIG-REFERENCE.md
# discord:
#   token: "your-bot-token"
#   channels: []            # integer channel IDs; empty = every channel the bot sees
#   guilds: []              # integer guild IDs; empty = every guild (DMs exempt)
#   users: []               # integer user IDs; empty = any user
#   mention_only: false     # reply only when the bot is mentioned
#   max_message_length: 2000                   # Discord's limit; longer answers are chunked
#   edit_stream_interval: 1.0                  # min seconds between progress edits; 0 = off
#   tool_embed_enabled: true                   # show a line per tool start/result
#   tool_line_max_chars: 80                    # {input}/{content} cut to this + "..."
#   tool_start_line: "▶ `{name}` - `{input}`"
#   tool_result_ok_line: "✓ `{name}` - `{content}`"     # newlines in {content} become |
#   tool_result_error_line: "✖ `{name}` - `{content}`"
#   thinking_message: "⏳ Thinking..."          # posted before the model call
#   auto_thread: false      # open a thread per new conversation
#   channel_areas:          # string channel ID -> area; "" = no area; else the channel name
#     "123456789": ""
